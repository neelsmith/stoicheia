project:
  type: website
  output-dir: quarto_build

version: "0.1.0"
metadata:
  date: today
  
execute:
  freeze: auto
date: last-modified  

format:
  html:
    theme:
      - cosmo
      - brand
    toc: true

website:
  title: "stoicheia"
  page-footer:
    center: "`stoicheia` version **{{< meta version >}}**, website last updated {{< meta date >}}"

  navbar:
    background: primary
    search: true
    left:
      - text: "Home"
        file: index.qmd
     

    right:
      - icon: person-circle
        menu:
          - text: "stoicheia on github"
            href: https://github.com/neelsmith/stoicheia
          - text: "Neel Smith"
            href: https://neelsmith.github.io/
        aria-label: Home 
